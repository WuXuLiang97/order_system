<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - 深圳市印客领科技有限公司 - 进销存线上管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            max-width: 420px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }
        .login-card .card-body {
            padding: 2rem;
        }
        .login-title {
            font-weight: 600;
            color: #1d3557;
        }
        .login-sub {
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card shadow-lg">
            <div class="card-body">
                <div class="text-center mb-4">
                    <i class="bi bi-box-seam display-4 text-primary"></i>
                    <h4 class="login-title mt-2 mb-1">深圳市印客领科技有限公司</h4>
                    <div class="login-sub small">进销存线上管理系统 · 请登录后使用</div>
                </div>
                <div id="loginError" class="alert alert-danger d-none py-2"></div>
                <form id="loginForm" autocomplete="on">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" placeholder="请输入用户名" autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" id="password" placeholder="请输入密码" autocomplete="current-password" required>
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-primary w-100">登 录</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
    $(function () {
        function showError(msg) {
            $('#loginError').removeClass('d-none').text(msg);
        }
        $('#loginForm').on('submit', function (e) {
            e.preventDefault();
            var username = $('#username').val().trim();
            var password = $('#password').val();
            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }
            $('#loginBtn').prop('disabled', true).text('登录中...');
            $.ajax({
                url: '/api/login',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username: username, password: password }),
                success: function (res) {
                    window.location.href = '/';
                },
                error: function (xhr) {
                    var msg = '登录失败，请稍后重试';
                    try {
                        var j = JSON.parse(xhr.responseText);
                        if (j.error) msg = j.error;
                    } catch (e) {}
                    showError(msg);
                    $('#loginBtn').prop('disabled', false).text('登 录');
                }
            });
        });
    });
    </script>
</body>
</html>
