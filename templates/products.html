{{define "content"}}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
                <h4 class="mb-0"><i class="bi bi-box"></i> 成品库存管理</h4>
                {{if .Can "product:manage"}}
                <div>
                    <button class="btn btn-success btn-sm me-2" data-bs-toggle="modal" data-bs-target="#productionModal">
                        <i class="bi bi-plus-circle"></i> 生产入库
                    </button>
                    <button class="btn btn-warning btn-sm me-2" data-bs-toggle="modal" data-bs-target="#outboundModal">
                        <i class="bi bi-box-arrow-right"></i> 成品出库
                    </button>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addProductModal">
                        <i class="bi bi-plus-circle"></i> 添加产品
                    </button>
                </div>
                {{end}}
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <input type="text" id="searchProduct" class="form-control" placeholder="搜索产品名称...">
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="productTable">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>名称</th>
                                <th>规格型号</th>
                                <th>单位</th>
                                <th>库存</th>
                                <th>单价</th>
                                <th>BOM</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            <!-- 由 JavaScript 动态加载 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 成品出库记录 -->
<div class="row mt-3">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
                <h5 class="mb-0"><i class="bi bi-box-arrow-right"></i> 成品出库记录（送货单）</h5>
                <span class="text-muted small">出库后可直接打印送货单，单据不含价格信息</span>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="outboundTable">
                        <thead>
                            <tr>
                                <th>送货单号</th>
                                <th>出库日期</th>
                                <th>收货单位</th>
                                <th>型号数</th>
                                <th>总数量</th>
                                <th>操作人</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="outboundTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 成品出库模态框 -->
<div class="modal fade" id="outboundModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-box-arrow-right"></i> 成品出库 / 送货单</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="outboundForm">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">出库日期</label>
                            <input type="date" class="form-control" id="outboundDate">
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">收货单位（可选，打印在送货单上）</label>
                            <input type="text" class="form-control" id="outboundReceiver" placeholder="客户名称 / 收货单位">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">出库明细（型号 + 数量）</label>
                        <div id="outboundItems"></div>
                        <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="addOutboundRow()">
                            <i class="bi bi-plus"></i> 添加一个型号
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <textarea class="form-control" id="outboundRemark" rows="2" placeholder="打印备注，如：随货附送货单、注意事项等"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-warning" onclick="submitOutbound()">保存出库并打印</button>
            </div>
        </div>
    </div>
</div>
<!-- 添加产品模态框（含 BOM） -->
<div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加产品</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addProductForm">
                    <div class="mb-3">
                        <label class="form-label">名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="addProductName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">规格型号</label>
                        <input type="text" class="form-control" id="addProductSpec">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">单位</label>
                        <input type="text" class="form-control" id="addProductUnit" value="个">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">库存</label>
                        <input type="number" class="form-control" id="addProductStock" value="0" step="any">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">单价</label>
                        <input type="number" class="form-control" id="addProductPrice" value="0" min="0" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">BOM清单（原材料组成）</label>
                        <div id="addBomItems">
                            <div class="row mb-2 bom-row">
                                <div class="col-md-6">
                                    <select class="form-control raw-material-select" required>
                                        <option value="">选择原材料</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <input type="number" class="form-control bom-quantity" placeholder="用量" step="0.001" min="0.001" required>
                                </div>
                                <div class="col-md-2">
                                    <button type="button" class="btn btn-danger btn-sm remove-bom-item">删除</button>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="addBomRow('addBomItems')">
                            <i class="bi bi-plus"></i> 添加原材料
                        </button>
                        <div id="addBomStatus" class="text-muted small mt-1"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="addProduct()">确认添加</button>
            </div>
        </div>
    </div>
</div>

<!-- 编辑产品模态框（含 BOM） -->
<div class="modal fade" id="editProductModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">编辑产品</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editProductForm">
                    <input type="hidden" id="editProductId">
                    <div class="mb-3">
                        <label class="form-label">名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="editProductName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">规格型号</label>
                        <input type="text" class="form-control" id="editProductSpec">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">单位</label>
                        <input type="text" class="form-control" id="editProductUnit">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">库存</label>
                        <input type="number" class="form-control" id="editProductStock" step="any">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">单价</label>
                        <input type="number" class="form-control" id="editProductPrice" min="0" step="0.01">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">BOM清单（原材料组成）</label>
                        <div id="editBomItems">
                            <div class="row mb-2 bom-row">
                                <div class="col-md-6">
                                    <select class="form-control raw-material-select" required>
                                        <option value="">选择原材料</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <input type="number" class="form-control bom-quantity" placeholder="用量" step="0.001" min="0.001" required>
                                </div>
                                <div class="col-md-2">
                                    <button type="button" class="btn btn-danger btn-sm remove-bom-item">删除</button>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="addBomRow('editBomItems')">
                            <i class="bi bi-plus"></i> 添加原材料
                        </button>
                        <div id="editBomStatus" class="text-muted small mt-1"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="updateProduct()">保存修改</button>
            </div>
        </div>
    </div>
</div>

<!-- 生产入库模态框 -->
<div class="modal fade" id="productionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">生产入库</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productionForm">
                    <div class="mb-3">
                        <label class="form-label">选择产品 <span class="text-danger">*</span></label>
                        <select class="form-control" id="productionProductId" required>
                            <option value="">请选择产品</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">生产数量 <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="productionQuantity" placeholder="请输入生产数量" step="any" min="0" required>
                    </div>
                    <div id="productionBomInfo" class="text-muted small"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" onclick="submitProduction()">确认入库</button>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
// ============================
// 工具函数：加载原材料到下拉框
// ============================
function loadRawMaterialsToSelect(containerId) {
    return new Promise((resolve, reject) => {
        $.ajax({
            url: '/api/raw-materials',
            method: 'GET',
            success: function(data) {
                var container = $('#' + containerId);
                container.find('.raw-material-select').each(function() {
                    var select = $(this);
                    var currentVal = select.val();
                    select.empty();
                    select.append('<option value="">选择原材料</option>');
                    data.forEach(function(m) {
                        select.append(`<option value="${m.id}">${m.name} (库存: ${m.stock} ${m.unit})</option>`);
                    });
                    if (currentVal) select.val(currentVal);
                });
                resolve(true);
            },
            error: function() {
                alert('加载原材料列表失败');
                reject(false);
            }
        });
    });
}

// ============================
// BOM 行操作
// ============================
function addBomRow(containerId) {
    var container = $('#' + containerId);
    var newRow = container.find('.bom-row:first').clone();
    newRow.find('select').val('');
    newRow.find('input').val('');
    container.append(newRow);
    loadRawMaterialsToSelect(containerId);
}

$(document).on('click', '.remove-bom-item', function() {
    var container = $(this).closest('.bom-row').parent();
    if (container.find('.bom-row').length > 1) {
        $(this).closest('.bom-row').remove();
    } else {
        alert('至少保留一行');
    }
});

// ============================
// 收集 BOM 数据
// ============================
function getBomData(containerId) {
    var items = [];
    var valid = true;
    var container = $('#' + containerId);
    container.find('.bom-row').each(function() {
        var rawMaterialId = $(this).find('.raw-material-select').val();
        var quantity = parseFloat($(this).find('.bom-quantity').val());
        if (rawMaterialId && !isNaN(quantity) && quantity > 0) {
            items.push({
                raw_material_id: parseInt(rawMaterialId),
                quantity: quantity
            });
        } else if (rawMaterialId || quantity) {
            valid = false;
        }
    });
    return { items: items, valid: valid };
}

// ============================
// 加载产品列表（显示BOM标记）
// ============================
function loadProducts() {
    $.ajax({
        url: '/api/products',
        method: 'GET',
        success: function(data) {
            var tbody = $('#productTableBody');
            tbody.empty();

            data.forEach(function(p, index) {
                var status = p.stock > 50 ? '充足' : p.stock > 10 ? '偏低' : '库存不足';
                var statusClass = p.stock > 50 ? 'success' : p.stock > 10 ? 'warning' : 'danger';
                var bomLabel = p.has_bom ? '<span class="badge bg-info">有</span>' : '<span class="badge bg-secondary">无</span>';

                var actions = '';
                if (window.PERMS && window.PERMS['product:manage']) {
                    actions = `<button class="btn btn-warning btn-sm me-1" onclick="editProduct(${p.id})">编辑</button>
                               <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">删除</button>`;
                }
                var row = `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.spec || '-'}</td>
                        <td>${p.unit || '-'}</td>
                        <td><span class="badge bg-${statusClass}">${p.stock}</span></td>
                        <td>¥${p.price.toFixed(2)}</td>
                        <td>${bomLabel}</td>
                        <td><span class="badge bg-${statusClass}">${status}</span></td>
                        <td>${actions}</td>
                    </tr>
                `;
                tbody.append(row);
            });

            applySearch();
        },
        error: function(xhr) {
            alert('加载产品失败: ' + xhr.responseText);
        }
    });
}

// 搜索功能
function applySearch() {
    var searchText = $('#searchProduct').val().toLowerCase();
    $('#productTableBody tr').each(function() {
        var name = $(this).find('td:eq(1)').text().toLowerCase();
        $(this).toggle(name.indexOf(searchText) > -1);
    });
}

$(document).ready(function() {
    loadProducts();
    $('#searchProduct').on('keyup', applySearch);

    // 当添加/编辑模态框打开时，加载原材料列表
    $('#addProductModal').on('shown.bs.modal', function() {
        loadRawMaterialsToSelect('addBomItems');
    });
    $('#editProductModal').on('shown.bs.modal', function() {
        loadRawMaterialsToSelect('editBomItems');
    });

    // 生产入库模态框打开时加载产品下拉框
    $('#productionModal').on('show.bs.modal', function() {
        loadProductionProducts();
    });
});

// ============================
// 添加产品
// ============================
function addProduct() {
    var name = $('#addProductName').val().trim();
    if (!name) {
        alert('请输入产品名称');
        return;
    }

    var data = {
        name: name,
        spec: $('#addProductSpec').val().trim(),
        unit: $('#addProductUnit').val().trim(),
        stock: parseFloat($('#addProductStock').val()) || 0,
        price: parseFloat($('#addProductPrice').val()) || 0,
        bom: []
    };

    var bomResult = getBomData('addBomItems');
    if (!bomResult.valid) {
        alert('BOM数据不完整，请检查原材料和用量');
        return;
    }
    data.bom = bomResult.items;

    $.ajax({
        url: '/api/products/add',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(response) {
            alert('添加成功');
            $('#addProductModal').modal('hide');
            $('#addProductForm')[0].reset();
            var container = $('#addBomItems');
            container.find('.bom-row:not(:first)').remove();
            container.find('.bom-row:first select').val('');
            container.find('.bom-row:first input').val('');
            loadProducts();
        },
        error: function(xhr) {
            alert('添加失败: ' + xhr.responseText);
        }
    });
}

// ============================
// 编辑产品（加载数据并填充）
// ============================
function editProduct(id) {
    $.ajax({
        url: `/api/products/get?id=${id}`,
        method: 'GET',
        success: function(data) {
            $('#editProductId').val(data.id);
            $('#editProductName').val(data.name);
            $('#editProductSpec').val(data.spec || '');
            $('#editProductUnit').val(data.unit || '');
            $('#editProductStock').val(data.stock);
            $('#editProductPrice').val(data.price);

            var container = $('#editBomItems');
            container.empty();
            var bom = data.bom || [];
            if (bom.length === 0) {
                container.append(`
                    <div class="row mb-2 bom-row">
                        <div class="col-md-6">
                            <select class="form-control raw-material-select" required>
                                <option value="">选择原材料</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <input type="number" class="form-control bom-quantity" placeholder="用量" step="0.001" min="0.001" required>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-danger btn-sm remove-bom-item">删除</button>
                        </div>
                    </div>
                `);
            } else {
                bom.forEach(function(item) {
                    var row = `
                        <div class="row mb-2 bom-row">
                            <div class="col-md-6">
                                <select class="form-control raw-material-select" required>
                                    <option value="">选择原材料</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <input type="number" class="form-control bom-quantity" placeholder="用量" step="0.001" min="0.001" required>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-danger btn-sm remove-bom-item">删除</button>
                            </div>
                        </div>
                    `;
                    container.append(row);
                    var rowElement = container.children().last();
                    rowElement.find('.raw-material-select').val(item.raw_material_id);
                    rowElement.find('.bom-quantity').val(item.quantity);
                });
            }

            loadRawMaterialsToSelect('editBomItems').then(() => {
                container.find('.bom-row').each(function(index) {
                    if (bom[index]) {
                        $(this).find('.raw-material-select').val(bom[index].raw_material_id);
                        $(this).find('.bom-quantity').val(bom[index].quantity);
                    }
                });
            });

            $('#editProductModal').modal('show');
        },
        error: function(xhr) {
            alert('加载产品数据失败: ' + xhr.responseText);
        }
    });
}

// ============================
// 更新产品
// ============================
function updateProduct() {
    var id = parseInt($('#editProductId').val());
    var name = $('#editProductName').val().trim();
    if (!name) {
        alert('请输入产品名称');
        return;
    }

    var data = {
        id: id,
        name: name,
        spec: $('#editProductSpec').val().trim(),
        unit: $('#editProductUnit').val().trim(),
        stock: parseFloat($('#editProductStock').val()) || 0,
        price: parseFloat($('#editProductPrice').val()) || 0,
        bom: []
    };

    var bomResult = getBomData('editBomItems');
    if (!bomResult.valid) {
        alert('BOM数据不完整，请检查原材料和用量');
        return;
    }
    data.bom = bomResult.items;

    $.ajax({
        url: '/api/products/update',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(response) {
            alert('更新成功');
            $('#editProductModal').modal('hide');
            loadProducts();
        },
        error: function(xhr) {
            alert('更新失败: ' + xhr.responseText);
        }
    });
}

// ============================
// 删除产品
// ============================
function deleteProduct(id) {
    if (!confirm('确定要删除该产品吗？')) return;

    $.ajax({
        url: `/api/products/delete?id=${id}`,
        method: 'POST',
        success: function(response) {
            alert('删除成功');
            loadProducts();
        },
        error: function(xhr) {
            alert('删除失败: ' + xhr.responseText);
        }
    });
}

// ============================
// 生产入库功能
// ============================

// 加载产品列表到生产入库下拉框
function loadProductionProducts() {
    $.ajax({
        url: '/api/products',
        method: 'GET',
        success: function(data) {
            var select = $('#productionProductId');
            select.empty();
            select.append('<option value="">请选择产品</option>');
            data.forEach(function(p, index) {
                select.append(`<option value="${p.id}">${p.name} (库存: ${p.stock})</option>`);
            });
            // 清空BOM信息
            $('#productionBomInfo').text('');
        },
        error: function() {
            alert('加载产品列表失败');
        }
    });
}

// 当选择产品时，显示BOM信息
$('#productionProductId').on('change', function() {
    var productId = $(this).val();
    if (productId) {
        $.ajax({
            url: `/api/products/get?id=${productId}`,
            method: 'GET',
            success: function(data) {
                var bom = data.bom || [];
                if (bom.length === 0) {
                    $('#productionBomInfo').html('<span class="text-warning">⚠️ 该产品无BOM，入库将不扣减原材料。</span>');
                } else {
                    var html = '<strong>📦 原材料消耗清单：</strong><br>';
                    bom.forEach(function(b) {
                        html += `- 原材料ID: ${b.raw_material_id}，用量: ${b.quantity}<br>`;
                    });
                    $('#productionBomInfo').html(html);
                }
            },
            error: function() {
                $('#productionBomInfo').html('<span class="text-danger">加载BOM信息失败</span>');
            }
        });
    } else {
        $('#productionBomInfo').text('');
    }
});

// 提交生产入库
function submitProduction() {
    var productId = $('#productionProductId').val();
    var quantity = parseFloat($('#productionQuantity').val());

    if (!productId) {
        alert('请选择产品');
        return;
    }
    if (!quantity || quantity <= 0) {
        alert('请输入有效的生产数量');
        return;
    }

    $.ajax({
        url: '/api/production',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            product_id: parseInt(productId),
            quantity: quantity
        }),
        success: function(response) {
            alert(response.message || '生产入库成功');
            $('#productionModal').modal('hide');
            $('#productionForm')[0].reset();
            $('#productionBomInfo').text('');
            loadProducts(); // 刷新列表
            loadProductionProducts(); // 刷新下拉框
        },
        error: function(xhr) {
            alert('生产入库失败: ' + xhr.responseText);
        }
    });
}
// ============================
// 成品出库 / 送货单
// ============================
var outboundProducts = [];

function qtyText(n) {
    var num = Number(n || 0);
    if (Number.isInteger(num)) return String(num);
    return String(Math.round(num * 1000) / 1000);
}

function buildOutboundRow() {
    var opts = '<option value="">请选择产品</option>';
    outboundProducts.forEach(function(p) {
        opts += `<option value="${p.id}">${p.name}（库存 ${qtyText(p.stock)} ${p.unit || ''}）</option>`;
    });
    return `<div class="row mb-2 outbound-row align-items-end">
        <div class="col-md-5">
            <select class="form-control outbound-product-select">${opts}</select>
        </div>
        <div class="col-md-2">
            <input type="text" class="form-control outbound-spec" placeholder="规格型号" readonly>
        </div>
        <div class="col-md-1">
            <input type="text" class="form-control outbound-unit" placeholder="单位" readonly>
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control outbound-qty" placeholder="出库数量" step="any" min="0">
        </div>
        <div class="col-md-2 text-end">
            <button type="button" class="btn btn-danger btn-sm remove-outbound-row"><i class="bi bi-trash"></i> 删除</button>
        </div>
    </div>`;
}

function refreshOutboundRowInfo(row) {
    var pid = parseInt(row.find('.outbound-product-select').val());
    var p = outboundProducts.find(function(x) { return x.id === pid; });
    if (p) {
        row.find('.outbound-spec').val(p.spec || '');
        row.find('.outbound-unit').val(p.unit || '');
    } else {
        row.find('.outbound-spec').val('');
        row.find('.outbound-unit').val('');
    }
}

function addOutboundRow() {
    $('#outboundItems').append(buildOutboundRow());
}

function todayStr() {
    var d = new Date();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + day;
}

$('#outboundModal').on('show.bs.modal', function() {
    $('#outboundForm')[0].reset();
    $('#outboundDate').val(todayStr());
    $('#outboundItems').empty();
    $.ajax({
        url: '/api/products',
        method: 'GET',
        success: function(data) {
            outboundProducts = data || [];
            $('#outboundItems').append(buildOutboundRow());
        },
        error: function() {
            alert('加载产品列表失败');
        }
    });
});

$(document).on('change', '.outbound-product-select', function() {
    refreshOutboundRowInfo($(this).closest('.outbound-row'));
});

$(document).on('click', '.remove-outbound-row', function() {
    if ($('#outboundItems .outbound-row').length > 1) {
        $(this).closest('.outbound-row').remove();
    } else {
        alert('至少保留一行');
    }
});

function submitOutbound() {
    var items = [];
    var valid = true;
    var errors = [];
    $('#outboundItems .outbound-row').each(function(index) {
        var row = $(this);
        var pid = parseInt(row.find('.outbound-product-select').val());
        var qty = parseFloat(row.find('.outbound-qty').val());
        if (!pid) {
            errors.push('第 ' + (index + 1) + ' 行：请选择产品');
            valid = false;
        } else if (!qty || qty <= 0) {
            errors.push('第 ' + (index + 1) + ' 行：出库数量必须大于 0');
            valid = false;
        } else {
            items.push({product_id: pid, quantity: qty});
        }
    });
    if (!valid) {
        alert(errors.join('\n'));
        return;
    }
    if (items.length === 0) {
        alert('请至少填写一行出库明细');
        return;
    }
    $.ajax({
        url: '/api/outbounds/create',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            out_date: $('#outboundDate').val(),
            receiver: $('#outboundReceiver').val().trim(),
            remark: $('#outboundRemark').val().trim(),
            items: items
        }),
        success: function(res) {
            alert((res.message || '成品出库成功') + '，单号：' + res.outbound_no);
            $('#outboundModal').modal('hide');
            loadProducts();
            loadOutbounds();
            window.open('/outbound/detail?id=' + res.id, '_blank');
        },
        error: function(xhr) {
            var msg = xhr.responseText;
            try { var j = JSON.parse(xhr.responseText); if (j.error) msg = j.error; } catch (e) {}
            alert('出库失败: ' + msg);
        }
    });
}

function loadOutbounds() {
    $.ajax({
        url: '/api/outbounds/list?limit=50',
        method: 'GET',
        success: function(data) {
            var tbody = $('#outboundTableBody');
            tbody.empty();
            if (!data || !data.length) {
                tbody.append('<tr><td colspan="7" class="text-center text-muted">暂无出库记录</td></tr>');
                return;
            }
            data.forEach(function(o) {
                var actions = `<a class="btn btn-outline-primary btn-sm me-1" href="/outbound/detail?id=${o.id}" target="_blank"><i class="bi bi-printer"></i> 打印送货单</a>`;
                if (window.PERMS && window.PERMS['product:manage']) {
                    actions += `<button class="btn btn-danger btn-sm" onclick="deleteOutbound(${o.id})"><i class="bi bi-trash"></i> 删除</button>`;
                }
                tbody.append(`<tr>
                    <td><span class="badge bg-dark">${escapeOut(o.outbound_no)}</span></td>
                    <td>${o.out_date ? String(o.out_date).slice(0, 10) : '-'}</td>
                    <td>${o.receiver ? escapeOut(o.receiver) : '-'}</td>
                    <td>${o.item_count || 0} 项</td>
                    <td><strong>${qtyText(o.total_quantity)}</strong></td>
                    <td>${escapeOut(o.created_by_name || '-')}</td>
                    <td class="text-nowrap">${actions}</td>
                </tr>`);
            });
        },
        error: function(xhr) {
            alert('加载出库记录失败: ' + xhr.responseText);
        }
    });
}

function deleteOutbound(id) {
    if (!confirm('确定删除该出库记录吗？删除后对应成品库存将自动回补。')) return;
    $.ajax({
        url: '/api/outbounds/delete?id=' + id,
        method: 'POST',
        success: function(res) {
            alert(res.message || '删除成功');
            loadOutbounds();
            loadProducts();
        },
        error: function(xhr) {
            var msg = xhr.responseText;
            try { var j = JSON.parse(xhr.responseText); if (j.error) msg = j.error; } catch (e) {}
            alert('删除失败: ' + msg);
        }
    });
}

function escapeOut(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadOutbounds();
</script>
{{end}}
