{{define "content"}}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
                <h4 class="mb-0"><i class="bi bi-people"></i> 用户管理</h4>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">
                    <i class="bi bi-plus-circle"></i> 添加用户
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="userTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>显示名称</th>
                                <th>角色</th>
                                <th>权限</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <!-- 由 JavaScript 动态加载 -->
                        </tbody>
                    </table>
                </div>
                <div class="text-muted small mt-1">
                    说明：勾选“编辑”会自动同时勾选该模块“查看”；未勾选任何模块的普通用户登录后将看不到任何业务模块。管理员拥有全部权限，无需授权。
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 添加用户模态框 -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加用户</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addUserForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">用户名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="addUsername" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">显示名称</label>
                            <input type="text" class="form-control" id="addDisplayName" placeholder="可选">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">密码 <span class="text-danger">*</span></label>
                            <input type="password" class="form-control" id="addPassword" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">角色 <span class="text-danger">*</span></label>
                            <select class="form-select" id="addRole">
                                <option value="user">普通用户（按下方授权）</option>
                                <option value="admin">管理员（全部权限）</option>
                            </select>
                        </div>
                    </div>
                    <div id="addPermSection">
                        <label class="form-label">模块授权（普通用户）</label>
                        <div id="addPermRows"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="addUser()">确认添加</button>
            </div>
        </div>
    </div>
</div>

<!-- 权限授权模态框 -->
<div class="modal fade" id="authPermModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">权限授权 - <span id="authUserLabel"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="authUserId">
                <div id="authPermRows"></div>
                <div class="text-muted small mt-1">勾选“编辑”会自动同时勾选该模块“查看”；保存后立即生效。</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveAuthPerm()">保存授权</button>
            </div>
        </div>
    </div>
</div>

<!-- 重置密码模态框 -->
<div class="modal fade" id="resetPwdModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">重置密码</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>将重置用户 <strong id="resetPwdUser"></strong> 的密码</p>
                <form id="resetPwdForm">
                    <input type="hidden" id="resetPwdId">
                    <div class="mb-3">
                        <label class="form-label">新密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="resetPwdValue" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-warning" onclick="confirmResetPwd()">确认重置</button>
            </div>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
var PERM_MODULES = [
    { key: 'order', name: '订单管理', select: true },
    { key: 'product', name: '库存管理', view: 'product:view', edits: ['product:manage'] },
    { key: 'material', name: '原材料管理', view: 'material:view', edits: ['material:manage'] },
    { key: 'purchase', name: '采购物料管理', view: 'purchase:view', edits: ['purchase:manage'] },
    { key: 'customer', name: '客户管理', view: 'customer:view', edits: ['customer:manage'] }
];

// 订单管理授权档位（范围式：查看范围 x 编辑范围）
var ORDER_LEVELS = [
    { label: '无权限', perms: [] },
    { label: '查看自己创建的', perms: ['order:view_own'] },
    { label: '查看全部', perms: ['order:view_all'] },
    { label: '查看全部 + 编辑自己创建的', perms: ['order:view_all', 'order:edit_own'] },
    { label: '编辑全部（含删除）', perms: ['order:edit_all'] }
];

function orderLevelOf(perms) {
    var has = {};
    (perms || []).forEach(function (p) { has[p] = true; });
    if (has['order:edit_all']) return 4;
    if (has['order:view_all'] && has['order:edit_own']) return 3;
    if (has['order:view_all']) return 2;
    if (has['order:view_own']) return 1;
    return 0;
}

function moduleRowsHtml(prefix, perms) {
    var has = {};
    (perms || []).forEach(function (p) { has[p] = true; });
    var rows = '';
    PERM_MODULES.forEach(function (m) {
        if (m.select) {
            var idx = orderLevelOf(perms);
            var opts = '';
            ORDER_LEVELS.forEach(function (lv, i) {
                opts += `<option value="${i}" ${i === idx ? 'selected' : ''}>${lv.label}</option>`;
            });
            rows += `<tr>
                <td>${m.name}</td>
                <td colspan="2"><select class="form-select perm-order-select" id="${prefix}_order_level">${opts}</select></td>
            </tr>`;
            return;
        }
        var view = !!has[m.view];
        var edit = m.edits.some(function (p) { return has[p]; });
        rows += `<tr>
            <td>${m.name}</td>
            <td><input type="checkbox" id="${prefix}_view_${m.key}" ${view ? 'checked' : ''}></td>
            <td><input type="checkbox" class="perm-edit" id="${prefix}_edit_${m.key}" data-prefix="${prefix}" data-module="${m.key}" ${edit ? 'checked' : ''}></td>
        </tr>`;
    });
    return `<table class="table table-sm table-bordered align-middle mb-0"><thead><tr><th>模块</th><th style="width:90px">查看</th><th style="width:90px">编辑</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderPermSection(containerId, prefix, perms) {
    $('#' + containerId).html(moduleRowsHtml(prefix, perms));
}

function collectPerms(prefix) {
    var list = [];
    PERM_MODULES.forEach(function (m) {
        if (m.select) {
            var lv = parseInt($('#' + prefix + '_order_level').val()) || 0;
            var lvPerms = ORDER_LEVELS[lv] ? ORDER_LEVELS[lv].perms : [];
            lvPerms.forEach(function (p) { list.push(p); });
            return;
        }
        var view = $('#' + prefix + '_view_' + m.key).prop('checked');
        var edit = $('#' + prefix + '_edit_' + m.key).prop('checked');
        if (edit) {
            list.push(m.view);
            m.edits.forEach(function (p) { list.push(p); });
        } else if (view) {
            list.push(m.view);
        }
    });
    return list;
}

function permSummary(perms) {
    if (!perms || !perms.length) return '<span class="text-muted">—</span>';
    var has = {};
    perms.forEach(function (p) { has[p] = true; });
    var parts = [];
    var oi = orderLevelOf(perms);
    if (oi > 0) parts.push('订单管理·' + ORDER_LEVELS[oi].label);
    PERM_MODULES.forEach(function (m) {
        if (m.select) return;
        if (has[m.view]) {
            var edit = m.edits.some(function (p) { return has[p]; });
            parts.push(m.name + (edit ? '·编辑' : '·查看'));
        }
    });
    return parts.join('、') || '<span class="text-muted">—</span>';
}
$(document).on('change', '.perm-edit', function () {
    if ($(this).prop('checked')) {
        $('#' + $(this).data('prefix') + '_view_' + $(this).data('module')).prop('checked', true);
    }
});

function loadUsers() {
    $.ajax({
        url: '/api/users',
        method: 'GET',
        success: function (data) {
            window.__USER_LIST__ = data || [];
            var tbody = $('#userTableBody');
            tbody.empty();
            if (!data || data.length === 0) {
                tbody.append('<tr><td colspan="7" class="text-center text-muted">暂无用户</td></tr>');
                return;
            }
            var currentId = window.CURRENT_USER ? window.CURRENT_USER.id : null;
            data.forEach(function (u) {
                var isAdmin = u.role === 'admin';
                var roleLabel = isAdmin
                    ? '<span class="badge bg-danger">管理员</span>'
                    : '<span class="badge bg-secondary">普通用户</span>';
                var permCell = isAdmin ? '<span class="badge bg-danger">全部权限</span>' : permSummary(u.permissions);
                var actions = '';
                if (!isAdmin) {
                    actions += `<button class="btn btn-info btn-sm me-1" onclick="showAuthPerm(${u.id}, '${u.username}', this)">授权</button>`;
                }
                actions += `<button class="btn btn-warning btn-sm me-1" onclick="showResetPwd(${u.id}, '${u.username}')">重置密码</button>`;
                if (currentId !== u.id) {
                    actions += `<button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id}, '${u.username}')">删除</button>`;
                } else {
                    actions += '<span class="text-muted small">当前账号</span>';
                }
                var row = `
                    <tr>
                        <td>${u.id}</td>
                        <td><strong>${u.username}</strong></td>
                        <td>${u.display_name || '-'}</td>
                        <td>${roleLabel}</td>
                        <td>${permCell}</td>
                        <td>${new Date(u.created_at).toLocaleString()}</td>
                        <td>${actions}</td>
                    </tr>
                `;
                tbody.append(row);
            });
        },
        error: function (xhr) {
            alert('加载用户失败: ' + xhr.responseText);
        }
    });
}

function showAuthPerm(id, username) {
    var users = window.__USER_LIST__ || [];
    var u = users.find(function (x) { return x.id === id; }) || { permissions: [] };
    $('#authUserId').val(id);
    $('#authUserLabel').text(username);
    renderPermSection('authPermRows', 'auth', u.permissions || []);
    $('#authPermModal').modal('show');
}

function saveAuthPerm() {
    var id = parseInt($('#authUserId').val());
    if (!id) { alert('参数错误'); return; }
    $.ajax({
        url: '/api/users/permissions',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ user_id: id, permissions: collectPerms('auth') }),
        success: function (res) {
            alert(res.message || '授权保存成功');
            $('#authPermModal').modal('hide');
            loadUsers();
        },
        error: function (xhr) {
            var msg = xhr.responseText;
            try { var j = JSON.parse(xhr.responseText); if (j.error) msg = j.error; } catch (e) {}
            alert('保存失败: ' + msg);
        }
    });
}

function addUser() {
    var username = $('#addUsername').val().trim();
    var password = $('#addPassword').val();
    var displayName = $('#addDisplayName').val().trim();
    var role = $('#addRole').val();
    if (!username || !password) {
        alert('请输入用户名和密码');
        return;
    }
    var permissions = role === 'admin' ? [] : collectPerms('add');
    $.ajax({
        url: '/api/users',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ username: username, password: password, display_name: displayName, role: role, permissions: permissions }),
        success: function (res) {
            alert(res.message || '添加成功');
            $('#addUserModal').modal('hide');
            $('#addUserForm')[0].reset();
            loadUsers();
        },
        error: function (xhr) {
            var msg = xhr.responseText;
            try { var j = JSON.parse(xhr.responseText); if (j.error) msg = j.error; } catch (e) {}
            alert('添加失败: ' + msg);
        }
    });
}

function showResetPwd(id, username) {
    $('#resetPwdId').val(id);
    $('#resetPwdUser').text(username);
    $('#resetPwdValue').val('');
    $('#resetPwdModal').modal('show');
}

function confirmResetPwd() {
    var id = parseInt($('#resetPwdId').val());
    var newPassword = $('#resetPwdValue').val();
    if (!newPassword) {
        alert('请输入新密码');
        return;
    }
    $.ajax({
        url: '/api/users/reset-password',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ id: id, new_password: newPassword }),
        success: function (res) {
            alert(res.message || '密码重置成功');
            $('#resetPwdModal').modal('hide');
        },
        error: function (xhr) {
            var msg = xhr.responseText;
            try { var j = JSON.parse(xhr.responseText); if (j.error) msg = j.error; } catch (e) {}
            alert('重置失败: ' + msg);
        }
    });
}

function deleteUser(id, username) {
    if (!confirm(`确定要删除用户“${username}”吗？`)) return;
    $.ajax({
        url: `/api/users/delete?id=${id}`,
        method: 'POST',
        success: function (res) {
            alert(res.message || '删除成功');
            loadUsers();
        },
        error: function (xhr) {
            var msg = xhr.responseText;
            try { var j = JSON.parse(xhr.responseText); if (j.error) msg = j.error; } catch (e) {}
            alert('删除失败: ' + msg);
        }
    });
}

$('#addUserModal').on('show.bs.modal', function () {
    $('#addRole').val('user');
    $('#addPermSection').show();
    renderPermSection('addPermRows', 'add', []);
});

$('#addRole').on('change', function () {
    $('#addPermSection').toggle($(this).val() === 'user');
});

$(document).ready(function () {
    loadUsers();
});
</script>
{{end}}
