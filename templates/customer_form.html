{{define "content"}}
<div class="editor-page-header">
    <div>
        <a href="/customers" class="btn btn-outline-secondary btn-sm mb-2"><i class="bi bi-arrow-left"></i> 返回客户列表</a>
        <h4 class="mb-1" id="customerEditorTitle"><i class="bi bi-person-plus"></i> 添加客户</h4>
        <div class="text-muted small">客户档案、合作模式和结算信息在一个独立表单页维护。</div>
    </div>
</div>

<div id="editorNotice"></div>

<div class="editor-layout">
    <aside class="editor-nav">
        <div class="small text-muted px-2 pt-1 pb-2">客户分区</div>
        <nav class="nav flex-column">
            <a class="nav-link active" href="#customer-identity" data-editor-section="#customer-identity"><i class="bi bi-person-vcard"></i> 基本身份</a>
            <a class="nav-link" href="#customer-classification" data-editor-section="#customer-classification"><i class="bi bi-tags"></i> 分类与归属</a>
            <a class="nav-link" href="#customer-business" data-editor-section="#customer-business"><i class="bi bi-briefcase"></i> 合作与结算</a>
            <a class="nav-link" href="#customer-docs" data-editor-section="#customer-docs"><i class="bi bi-file-text"></i> 开票与唛头</a>
        </nav>
    </aside>

    <main>
        <form id="customerEditorForm" novalidate>
            <input type="hidden" id="customerId" value="0">

            <section class="editor-section" id="customer-identity">
                <div class="editor-section-header">
                    <h5><i class="bi bi-person-vcard"></i> 基本身份</h5>
                    <span class="badge bg-light text-dark border">第 1 区</span>
                </div>
                <div class="editor-section-body">
                    <div class="row">
                        <div class="col-md-3 mb-3" id="customerCodeWrap" style="display:none;">
                            <label class="form-label">客户编号</label>
                            <input type="text" class="form-control" id="customerCode" readonly>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">客户名称（简称）<span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="customerName" placeholder="列表显示用" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">客户全称</label>
                            <input type="text" class="form-control" id="customerFullName" placeholder="国内：营业执照全称；海外：英文全称（报关用）">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">联系电话</label>
                            <input type="text" class="form-control" id="customerPhone" placeholder="手机 / 固话">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">国家 / 地区</label>
                            <input type="text" class="form-control" id="customerCountry" placeholder="海外客户必填">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">收货地址</label>
                            <input type="text" class="form-control" id="customerAddress">
                        </div>
                    </div>
                </div>
            </section>

            <section class="editor-section" id="customer-classification">
                <div class="editor-section-header">
                    <h5><i class="bi bi-tags"></i> 分类与归属</h5>
                    <span class="badge bg-light text-dark border">第 2 区</span>
                </div>
                <div class="editor-section-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">客户类型</label>
                            <select class="form-select" id="customerType"><option value="">请选择</option></select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">客户状态</label>
                            <select class="form-select" id="customerStatus"></select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">客户等级</label>
                            <select class="form-select" id="customerLevel"><option value="">未评级</option></select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">风险等级</label>
                            <select class="form-select" id="customerRisk"></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">所属业务员</label>
                            <select class="form-select" id="customerOwner"><option value="0">未分配</option></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">客户来源</label>
                            <select class="form-select" id="customerSource"><option value="">请选择</option></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">客户品牌名</label>
                            <input type="text" class="form-control" id="customerBrands" placeholder="多个品牌用逗号分隔，OEM 客户必填">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">合作模式（可多选）</label>
                            <div id="customerModesWrap" class="d-flex flex-wrap gap-2"></div>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">目标市场（可多选）</label>
                            <div id="customerMarketsWrap" class="d-flex flex-wrap gap-2"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="editor-section" id="customer-business">
                <div class="editor-section-header">
                    <h5><i class="bi bi-briefcase"></i> 合作与结算</h5>
                    <span class="badge bg-light text-dark border">第 3 区</span>
                </div>
                <div class="editor-section-body">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">客户币种</label>
                            <select class="form-select" id="customerCurrency"></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">结算方式</label>
                            <select class="form-select" id="customerPayment"><option value="">请选择</option></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">贸易术语</label>
                            <select class="form-select" id="customerTrade"><option value="">请选择</option></select>
                        </div>
                    </div>
                </div>
            </section>

            <section class="editor-section" id="customer-docs">
                <div class="editor-section-header">
                    <h5><i class="bi bi-file-text"></i> 开票、唛头与备注</h5>
                    <span class="badge bg-light text-dark border">最后一步</span>
                </div>
                <div class="editor-section-body">
                    <div class="row">
                        <div class="col-12 mb-3">
                            <label class="form-label">开票信息</label>
                            <textarea class="form-control" id="customerInvoice" rows="3" placeholder="国内：抬头、税号、开户行；海外：PI 收件信息"></textarea>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">唛头模板</label>
                            <textarea class="form-control" id="customerShipping" rows="3" placeholder="客户固定出货唛头"></textarea>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="customerRemark" rows="3" placeholder="配方保密、包材禁忌、业务注意事项等"></textarea>
                        </div>
                    </div>
                </div>
            </section>
        </form>
    </main>
</div>

<div class="editor-summary">
    <div class="editor-summary-inner">
        <div class="editor-summary-metrics">
            <div class="editor-summary-metric"><span>当前模式</span><strong id="customerSummaryMode">添加客户</strong></div>
            <div class="editor-summary-metric"><span>客户状态</span><strong id="customerSummaryStatus">潜在客户</strong></div>
            <div class="editor-summary-metric"><span>所属业务员</span><strong id="customerSummaryOwner">未分配</strong></div>
        </div>
        <div class="editor-summary-actions">
            <a href="/customers" class="btn btn-outline-secondary">取消</a>
            <button type="submit" form="customerEditorForm" class="btn btn-primary px-4" id="saveCustomerButton">
                <i class="bi bi-check2-circle"></i> 确认添加
            </button>
        </div>
    </div>
</div>
{{end}}

{{define "scripts"}}
<script>
const CUSTOMER_EDITOR_TYPES = ["国内OEM","国内品牌经销商","海外OEM","海外品牌商","外贸贸易商","代理商","终端客户"];
const CUSTOMER_EDITOR_STATUSES = ["潜在客户","意向客户","正式合作","暂停合作","终止合作"];
const CUSTOMER_EDITOR_LEVELS = ["A","B","C","D"];
const CUSTOMER_EDITOR_COOP_MODES = ["OEM贴牌","ODM定制配方","采购自有品牌","定制包材","散装大桶墨水采购","大品牌分销商"];
const CUSTOMER_EDITOR_TARGET_MARKETS = ["国内","东南亚","欧洲","美洲","中东","其他"];
const CUSTOMER_EDITOR_CURRENCIES = ["CNY","USD","EUR","GBP","JPY","HKD","AUD"];
const CUSTOMER_EDITOR_PAYMENT_TERMS = ["现结","到付","月结30天","月结60天","T/T","L/C","其他"];
const CUSTOMER_EDITOR_TRADE_TERMS = ["EXW","FOB","CIF","DDP"];
const CUSTOMER_EDITOR_SOURCES = ["展会","阿里国际站","独立站","转介绍","其他"];
const CUSTOMER_EDITOR_RISK_LEVELS = ["低","中","高"];
const CUSTOMER_EDITOR_FOREIGN_TYPES = ["海外OEM","海外品牌商"];
const CUSTOMER_EDITOR_OEM_TYPES = ["国内OEM","海外OEM"];

var customerEditorIsEdit = false;

function customerEditorFillSelect(selector, values, emptyText) {
    var html = emptyText === undefined ? '' : '<option value="">' + emptyText + '</option>';
    values.forEach(function (value) { html += '<option value="' + value + '">' + value + '</option>'; });
    $(selector).html(html);
}

function customerEditorFillCheckboxes(selector, values, className) {
    var html = '';
    values.forEach(function (value) {
        var id = className + '-' + Math.random().toString(36).slice(2);
        html += '<div class="form-check form-check-inline"><input class="form-check-input ' + className + '" type="checkbox" value="' + value + '" id="' + id + '"><label class="form-check-label" for="' + id + '">' + value + '</label></div>';
    });
    $(selector).html(html);
}

function customerEditorChecked(className) {
    return $('#customerEditorForm .' + className + ':checked').map(function () { return $(this).val(); }).get();
}

function setupCustomerEditorOptions() {
    customerEditorFillSelect('#customerType', CUSTOMER_EDITOR_TYPES, '请选择');
    customerEditorFillSelect('#customerStatus', CUSTOMER_EDITOR_STATUSES);
    customerEditorFillSelect('#customerLevel', CUSTOMER_EDITOR_LEVELS, '未评级');
    customerEditorFillSelect('#customerRisk', CUSTOMER_EDITOR_RISK_LEVELS);
    customerEditorFillSelect('#customerSource', CUSTOMER_EDITOR_SOURCES, '请选择');
    customerEditorFillSelect('#customerCurrency', CUSTOMER_EDITOR_CURRENCIES);
    customerEditorFillSelect('#customerPayment', CUSTOMER_EDITOR_PAYMENT_TERMS, '请选择');
    customerEditorFillSelect('#customerTrade', CUSTOMER_EDITOR_TRADE_TERMS, '请选择');
    customerEditorFillCheckboxes('#customerModesWrap', CUSTOMER_EDITOR_COOP_MODES, 'customer-mode');
    customerEditorFillCheckboxes('#customerMarketsWrap', CUSTOMER_EDITOR_TARGET_MARKETS, 'customer-market');
    $('#customerStatus').val('潜在客户');
    $('#customerRisk').val('低');
    $('#customerCurrency').val('CNY');
    updateCustomerEditorSummary();
}

function loadCustomerEditorUsers() {
    return $.ajax({
        url: '/api/users/options',
        method: 'GET',
        success: function (data) {
            var select = $('#customerOwner').empty();
            select.append($('<option>').val('0').text('未分配'));
            (Array.isArray(data) ? data : []).forEach(function (user) {
                select.append($('<option>').val(String(user.id)).text(user.name || user.username || ''));
            });
        }
    });
}

function setCustomerEditorOwner(ownerID, ownerName) {
    var select = $('#customerOwner');
    var value = String(parseInt(ownerID, 10) || 0);
    if (value !== '0' && select.find('option').filter(function () { return this.value === value; }).length === 0) {
        select.append($('<option>').val(value).text(ownerName || ('#' + value)));
    }
    select.val(value);
}

function collectCustomerEditorData() {
    return {
        id: customerEditorIsEdit ? (parseInt($('#customerId').val(), 10) || 0) : 0,
        name: ($('#customerName').val() || '').trim(),
        full_name: ($('#customerFullName').val() || '').trim(),
        phone: ($('#customerPhone').val() || '').trim(),
        country_region: ($('#customerCountry').val() || '').trim(),
        address: ($('#customerAddress').val() || '').trim(),
        customer_type: $('#customerType').val() || '',
        status: $('#customerStatus').val() || '潜在客户',
        level: $('#customerLevel').val() || '',
        risk_level: $('#customerRisk').val() || '低',
        owner_user_id: parseInt($('#customerOwner').val(), 10) || 0,
        source: $('#customerSource').val() || '',
        cooperation_modes: customerEditorChecked('customer-mode'),
        target_markets: customerEditorChecked('customer-market'),
        brand_names: ($('#customerBrands').val() || '').split(/[,，]/).map(function (value) { return value.trim(); }).filter(Boolean),
        currency: $('#customerCurrency').val() || 'CNY',
        payment_terms: $('#customerPayment').val() || '',
        trade_terms: $('#customerTrade').val() || '',
        invoice_info: ($('#customerInvoice').val() || '').trim(),
        shipping_mark: ($('#customerShipping').val() || '').trim(),
        remark: ($('#customerRemark').val() || '').trim()
    };
}

function validateCustomerEditorData(data) {
    if (!data.name) return '请输入客户名称（简称）。';
    if (CUSTOMER_EDITOR_OEM_TYPES.indexOf(data.customer_type) >= 0 && !data.brand_names.length) return 'OEM 客户必须填写客户品牌名。';
    if (CUSTOMER_EDITOR_FOREIGN_TYPES.indexOf(data.customer_type) >= 0 && !data.country_region) return '境外客户必须填写国家 / 地区。';
    return '';
}

function updateCustomerEditorSummary() {
    $('#customerSummaryStatus').text($('#customerStatus').val() || '潜在客户');
    $('#customerSummaryOwner').text($('#customerOwner option:selected').text() || '未分配');
}

function saveCustomerEditor() {
    var data = collectCustomerEditorData();
    var error = validateCustomerEditorData(data);
    if (error) {
        EntityEditor.notify(error, 'error');
        if (!data.name) EntityEditor.focusField('#customerName');
        else if (CUSTOMER_EDITOR_OEM_TYPES.indexOf(data.customer_type) >= 0 && !data.brand_names.length) EntityEditor.focusField('#customerBrands');
        else EntityEditor.focusField('#customerCountry');
        return false;
    }
    return EntityEditor.save({
        url: customerEditorIsEdit ? '/api/customers/update' : '/api/customers/add',
        data: data,
        errorMessage: customerEditorIsEdit ? '保存失败：' : '添加失败：',
        success: function () { window.location.href = '/customers'; }
    });
}

function loadCustomerForEdit(id) {
    $.ajax({
        url: '/api/customers/get?id=' + id,
        method: 'GET',
        success: function (data) {
            $('#customerId').val(data.id || id);
            $('#customerCode').val(data.code || '');
            $('#customerCodeWrap').show();
            $('#customerName').val(data.name || '');
            $('#customerFullName').val(data.full_name || '');
            $('#customerPhone').val(data.phone || '');
            $('#customerCountry').val(data.country_region || '');
            $('#customerAddress').val(data.address || '');
            $('#customerType').val(data.customer_type || '');
            $('#customerStatus').val(data.status || '潜在客户');
            $('#customerLevel').val(data.level || '');
            $('#customerRisk').val(data.risk_level || '低');
            setCustomerEditorOwner(data.owner_user_id, data.owner_name);
            $('#customerSource').val(data.source || '');
            $('#customerBrands').val((data.brand_names || []).join(', '));
            $('#customerCurrency').val(data.currency || 'CNY');
            $('#customerPayment').val(data.payment_terms || '');
            $('#customerTrade').val(data.trade_terms || '');
            $('#customerInvoice').val(data.invoice_info || '');
            $('#customerShipping').val(data.shipping_mark || '');
            $('#customerRemark').val(data.remark || '');
            $('#customerEditorForm .customer-mode').prop('checked', false);
            (data.cooperation_modes || []).forEach(function (value) { $('#customerEditorForm .customer-mode[value="' + value + '"]').prop('checked', true); });
            $('#customerEditorForm .customer-market').prop('checked', false);
            (data.target_markets || []).forEach(function (value) { $('#customerEditorForm .customer-market[value="' + value + '"]').prop('checked', true); });
            $('#customerEditorTitle').html('<i class="bi bi-pencil-square"></i> ').append($('<span>').text('编辑客户 ' + String(data.code || data.name || '')));
            $('#customerSummaryMode').text('编辑客户');
            $('#saveCustomerButton').html('<i class="bi bi-check2-circle"></i> 保存修改');
            updateCustomerEditorSummary();
            EntityEditor.markClean();
        },
        error: function (xhr) {
            EntityEditor.notify('加载客户失败：' + EntityEditor.parseJSONResponse(xhr, '请求失败'), 'error');
        }
    });
}

$(document).ready(function () {
    setupCustomerEditorOptions();
    var usersReady = loadCustomerEditorUsers();
    $('#customerStatus, #customerOwner').on('change', updateCustomerEditorSummary);
    customerEditorIsEdit = EntityEditor.entityID('id') > 0;
    if (customerEditorIsEdit) {
        usersReady.always(function () { loadCustomerForEdit(EntityEditor.entityID('id')); });
    } else {
        EntityEditor.markClean();
    }
    EntityEditor.bindForm('#customerEditorForm', saveCustomerEditor, { button: '#saveCustomerButton' });
});
</script>
{{end}}
