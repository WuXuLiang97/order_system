{{define "content"}}
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center flex-wrap">
                <h4 class="mb-0"><i class="bi bi-cart"></i> 订单管理</h4>
                {{if .CanAny "order:edit_all" "order:edit_own"}}
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createOrderModal">
                    <i class="bi bi-plus-circle"></i> 创建订单
                </button>
                {{end}}
            </div>
            <div class="card-body">
                <div class="row mb-3 filter-row">
                    <div class="col-md-3 col-6 mb-2">
                        <select class="form-select" id="filterStatus">
                            <option value="">全部状态</option>
                            <option value="0">待生产</option>
                            <option value="1">生产中</option>
                            <option value="2">待发货</option>
                            <option value="3">已发货</option>
                            <option value="4">已取消</option>
                        </select>
                    </div>
                    <div class="col-md-5 col-6 mb-2">
                        <input type="text" class="form-control" id="searchKeyword" placeholder="搜索订单号、客户名称或地区...">
                    </div>
                    <div class="col-md-2 col-6">
                        <button class="btn btn-primary w-100" onclick="applyFilter()"><i class="bi bi-search"></i> 搜索</button>
                    </div>
                    <div class="col-md-2 col-6">
                        <button class="btn btn-secondary w-100" onclick="resetFilter()"><i class="bi bi-arrow-counterclockwise"></i> 重置</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="orderTable">
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>客户名称</th>
                                <th>地区</th>
                                <th>产品数</th>
                                <th>销售数量</th>
                                <th>订单金额</th>
                                <th>下单日期</th>
                                <th>预计发货日期</th>
                                <th>客户需求到货日</th>
                                <th>预警</th>
                                <th>订单状态</th>
                                <th>发货进度</th>
                                <th>回款状态</th>
                                <th>备注</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody"></tbody>
                    </table>
                </div>
                <div class="row mt-3">
                    <div class="col-md-3">
                        <label class="form-label">汇总月份</label>
                        <input type="month" id="summaryMonth" class="form-control">
                    </div>
                    <div class="col-md-9 d-flex align-items-end flex-wrap gap-3">
                        <div class="me-4">
                            <span class="text-muted">当月发货金额（已发货）：</span>
                            <strong id="monthlyTotal" class="fs-5 text-primary">¥0.00</strong>
                        </div>
                        <div class="me-4">
                            <span class="text-muted">当月发货单数（已发货）：</span>
                            <strong id="monthlyCount" class="fs-5 text-primary">0</strong>
                        </div>
                        <div class="me-4">
                            <span class="text-muted">年度发货金额（已发货）：</span>
                            <strong id="yearlyTotal" class="fs-5 text-success">¥0.00</strong>
                        </div>
                        <div>
                            <span class="text-muted">年度发货单数（已发货）：</span>
                            <strong id="yearlyCount" class="fs-5 text-success">0</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 创建订单模态框 -->
<div class="modal fade" id="createOrderModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">创建新订单</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createOrderForm">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label">选择客户</label>
                            <input type="text" class="form-control customer-search-input" id="customerSearchInput" list="customerAutocompleteOptions" placeholder="输入客户名称、编号或电话，也可直接手动填写下方客户名称" autocomplete="off">
                            <input type="hidden" id="customerId">
                            <datalist id="customerAutocompleteOptions"></datalist>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">客户名称 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="customerName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">电话号码</label>
                            <input type="text" class="form-control" id="customerPhone">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">收货地址</label>
                            <input type="text" class="form-control" id="customerAddress">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">地区</label>
                            <input type="text" class="form-control" id="region">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">下单日期</label>
                            <input type="date" class="form-control" id="orderDate">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">预计发货日期</label>
                            <input type="date" class="form-control" id="expectedShippingDate">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">客户需求到货日</label>
                            <input type="date" class="form-control" id="customerRequiredDate">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">物流天数（天）</label>
                            <input type="number" class="form-control" id="logisticsDays" min="0" step="1" value="0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">回款状态</label>
                            <select class="form-control" id="paymentStatus">
                                <option value="0">否</option>
                                <option value="1">是</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">制单</label>
                            <input type="text" class="form-control" id="preparedBy" placeholder="制单人（默认为当前登录人）">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">负责人（业务员）</label>
                            <select class="form-control" id="orderOwner"><option value="0">未分配</option></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">货款结算</label>
                            <div class="d-flex gap-2">
                                <select class="form-control flex-shrink-0" style="width:130px;" id="paymentSettlement">
                                    <option value="现付">现付</option>
                                    <option value="自定义">自定义</option>
                                </select>
                                <input type="text" class="form-control" id="paymentSettlementCustom" placeholder="请输入货款结算方式，如：月结30天" disabled>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">运费支付</label>
                            <div class="d-flex gap-2">
                                <select class="form-control flex-shrink-0" style="width:130px;" id="freightPayment">
                                    <option value="现付">现付</option>
                                    <option value="自定义">自定义</option>
                                </select>
                                <input type="text" class="form-control" id="freightPaymentCustom" placeholder="请输入运费支付方式" disabled>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">运费回收</label>
                                <select class="form-control" id="freightRecovery">
                                    <option value="可回收">可回收</option>
                                    <option value="不可回收">不可回收</option>
                                </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">运输方式</label>
                            <div class="d-flex gap-2">
                                <select class="form-control flex-shrink-0" style="width:130px;" id="transportMethod">
                                    <option value="物流">物流</option>
                                    <option value="快递">快递</option>
                                    <option value="自定义">自定义</option>
                                </select>
                                <input type="text" class="form-control" id="transportMethodCustom" placeholder="请输入运输方式" disabled>
                            </div>
                        </div>
<div class="col-md-12 mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="createRemark" rows="2"></textarea>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">币种</label>
                            <select class="form-control" id="currency"><option value="CNY">CNY</option></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">贸易术语</label>
                            <select class="form-control" id="tradeTerms"><option value="">无</option></select>
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">唛头</label>
                            <textarea class="form-control" id="shippingMark" rows="2" placeholder="客户固定出货唛头"></textarea>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">产品明细</label>
                        <div id="orderItems">
                            <div class="row mb-2 item-row">
                                <div class="col-md-3">
                                    <input type="text" class="form-control product-input" list="orderProductOptions" placeholder="输入产品名称、规格或单位" autocomplete="off" required>
                                    <input type="hidden" class="product-id-input">
                                </div>
                                <div class="col-md-2">
                                    <input type="text" class="form-control spec-display" placeholder="规格型号" readonly>
                                </div>
                                <div class="col-md-1">
                                    <input type="text" class="form-control unit-display" placeholder="单位" readonly>
                                </div>
                                <div class="col-md-2">
                                    <input type="number" class="form-control quantity-input" placeholder="销售数量" min="1" required>
                                </div>
                                <div class="col-md-2">
                                    <input type="number" class="form-control price-display" placeholder="单价" min="0" step="0.01">
                                </div>
                                <div class="col-md-1">
                                    <input type="number" class="form-control amount-display" placeholder="金额" step="0.01" readonly>
                                </div>
                                <div class="col-md-1">
                                    <button type="button" class="btn btn-danger btn-sm remove-item">删除</button>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="addOrderItem()">
                            <i class="bi bi-plus"></i> 添加产品
                        </button>
                        <datalist id="orderProductOptions"></datalist>
                        <div id="productLoadStatus" class="text-muted small mt-1"></div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="createOrder()">提交订单</button>
            </div>
        </div>
    </div>
</div>

{{define "scripts"}}
<script>
var productCache = [];
var customerCache = [];
var orderProductAutocomplete = null;
var customerAutocomplete = null;

var CURRENCY_OPTIONS = ['CNY','USD','EUR','GBP','JPY','HKD','AUD'];
var TRADE_TERM_OPTIONS = ['EXW','FOB','CIF','DDP'];
function fillOrderOptionSelects() {
    var curHtml = '';
    CURRENCY_OPTIONS.forEach(function(c) { curHtml += '<option value="' + c + '">' + c + '</option>'; });
    $('#currency').html(curHtml);
    $('#editCurrency').html(curHtml);
    var tradeHtml = '<option value="">无</option>';
    TRADE_TERM_OPTIONS.forEach(function(t) { tradeHtml += '<option value="' + t + '">' + t + '</option>'; });
    $('#tradeTerms').html(tradeHtml);
    $('#editTradeTerms').html(tradeHtml);
}

function formatDate(value) {
    if (!value) return '-';
    return value.slice(0, 10);
}
function warnHtml(level, label) {
    if (!level) return '-';
    var cls = {red: 'warn-red', orange: 'warn-orange', yellow: 'warn-yellow', blue: 'warn-blue'}[level] || 'warn-gray';
    return `<span class="warn-dot ${cls}"></span>${label || ''}`;
}

function orderMoney(order, v) {
    var num = Number(v || 0).toFixed(2);
    return (order.currency && order.currency !== 'CNY' ? order.currency + ' ' : '¥') + num;
}

function escapeOrderHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function toggleOrderDetails(orderID) {
    var detailRow = $(`.order-detail-row[data-order-id="${orderID}"]`);
    var toggle = $(`.order-detail-toggle[data-order-id="${orderID}"]`);
    var willShow = detailRow.hasClass('d-none');
    detailRow.toggleClass('d-none', !willShow);
    toggle.attr('aria-expanded', willShow ? 'true' : 'false');
    toggle.find('i').toggleClass('bi-chevron-right', !willShow).toggleClass('bi-chevron-down', willShow);
}

function fillOwnerOptions() {
    if (window.__OWNER_OPTIONS__) return;
    $.ajax({
        url: '/api/users/options',
        method: 'GET',
        success: function(data) {
            window.__OWNER_OPTIONS__ = data || [];
            var html = '<option value="0">未分配</option>';
            window.__OWNER_OPTIONS__.forEach(function(u) {
                html += '<option value="' + u.id + '">' + u.name + '</option>';
            });
            $('#orderOwner, #editOrderOwner').html(html);
            if (window.CURRENT_USER && $('#orderOwner').val() !== String(window.CURRENT_USER.id)) {
                $('#orderOwner').val(window.CURRENT_USER.id);
            }
        },
        error: function() { /* 忽略：加载失败时负责人仅未分配 */ }
    });
}

function currentUserName() {
    var cu = window.CURRENT_USER || {};
    return cu.display_name || cu.username || '';
}

function refreshCustomField(selectId, inputId) {
    var custom = $('#' + selectId).val() === '自定义';
    $('#' + inputId).prop('disabled', !custom).toggle(custom);
}

function bindCustomField(selectId, inputId) {
    $('#' + selectId).on('change', function () {
        refreshCustomField(selectId, inputId);
    });
}

function customFieldValue(selectId, inputId) {
    var v = $('#' + selectId).val();
    if (v !== '自定义') return v;
    var t = ($('#' + inputId).val() || '').trim();
    return t === '' ? '自定义' : t;
}

function setCustomField(selectId, inputId, stored, presets) {
    if (presets.indexOf(stored) >= 0) {
        $('#' + selectId).val(stored);
        $('#' + inputId).prop('disabled', true).hide().val('');
    } else {
        $('#' + selectId).val('自定义');
        $('#' + inputId).prop('disabled', false).show().val(stored || '');
    }
}

function productDisplayValue(product) {
    var details = [];
    if (product.spec) details.push('规格：' + product.spec);
    if (product.unit) details.push('单位：' + product.unit);
    details.push('库存：' + Number(product.stock || 0));
    return (product.name || '') + (details.length ? '（' + details.join('，') + '）' : '');
}

function clearOrderRowProduct(input) {
    var row = $(input).closest('.item-row');
    row.find('.product-id-input').val('');
    row.find('.spec-display').val('');
    row.find('.unit-display').val('');
    row.find('.price-display').val('');
    recalcRow(row);
}

function applyOrderProductSelection(product, input) {
    var row = $(input).closest('.item-row');
    row.find('.product-id-input').val(product.id);
    row.find('.spec-display').val(product.spec || '');
    row.find('.unit-display').val(product.unit || '');
    row.find('.price-display').val(product.price || 0);
    recalcRow(row);
}

function initOrderProductAutocomplete() {
    if (orderProductAutocomplete) return;
    orderProductAutocomplete = AutoComplete.create({
        name: 'order_product',
        inputSelector: '.product-input',
        hiddenSelector: '.product-id-input',
        datalistSelector: '#orderProductOptions',
        getId: function(product) { return product.id; },
        getDisplay: productDisplayValue,
        getAliases: function(product) { return [product.name]; },
        sortItems: function(a, b) {
            return (a.name || '').localeCompare(b.name || '', 'zh-CN');
        },
        onSelect: applyOrderProductSelection,
        onClear: function(_, input) { clearOrderRowProduct(input); }
    });
}

function loadProducts(callback) {
    $.ajax({
        url: '/api/products',
        method: 'GET',
        success: function(data) {
            productCache = data || [];
            $('#productLoadStatus').text('');
            if (productCache.length === 0) {
                $('#productLoadStatus').html('<span class="text-danger">⚠️ 暂无产品，请先添加产品！</span>');
            }
            initOrderProductAutocomplete();
            orderProductAutocomplete.setItems(productCache);
            if (callback) callback();
        },
        error: function() {
            $('#productLoadStatus').html('<span class="text-danger">⚠️ 加载产品列表失败</span>');
            if (callback) callback();
        }
    });
}

function customerDisplayValue(customer) {
    var parts = [];
    if (customer.code) parts.push(customer.code);
    parts.push(customer.name || '');
    var label = parts.join(' ');
    var extras = [];
    if (customer.phone) extras.push('电话：' + customer.phone);
    if (customer.full_name && customer.full_name !== customer.name) extras.push('全称：' + customer.full_name);
    return label + (extras.length ? '（' + extras.join('，') + '）' : '');
}

function applyCustomerSelection(customer) {
    $('#customerId').val(customer.id);
    $('#customerName').val(customer.name || '');
    $('#customerPhone').val(customer.phone || '');
    $('#customerAddress').val(customer.address || '');
    $('#currency').val(customer.currency || 'CNY');
    $('#tradeTerms').val(customer.trade_terms || '');
    $('#shippingMark').val(customer.shipping_mark || '');
    setCustomField('paymentSettlement', 'paymentSettlementCustom', customer.payment_terms || '', ['现付']);
    if (customer.country_region && !$('#region').val()) {
        $('#region').val(customer.country_region);
    }
}

function initCustomerAutocomplete() {
    if (customerAutocomplete) return;
    customerAutocomplete = AutoComplete.create({
        name: 'order_customer',
        inputSelector: '#customerSearchInput',
        hiddenSelector: '#customerId',
        datalistSelector: '#customerAutocompleteOptions',
        getId: function(customer) { return customer.id; },
        getDisplay: customerDisplayValue,
        getAliases: function(customer) {
            return [customer.name, customer.code, customer.phone, customer.full_name];
        },
        sortItems: function(a, b) {
            return (a.name || '').localeCompare(b.name || '', 'zh-CN');
        },
        onSelect: applyCustomerSelection,
        onClear: function() {
            $('#customerId').val('');
        }
    });
}

function loadCustomersToSelect() {

            initCustomerAutocomplete();
            customerAutocomplete.setItems(customerCache);

}

function recalcRow(row) {

    row.find('.amount-display').val((qty * price).toFixed(2));

function loadOrders(status, keyword) {
    var params = {};
    if (status && status !== '') params.status = status;
    if (keyword && keyword.trim() !== '') params.keyword = keyword.trim();

    $.ajax({
        url: '/api/orders/list',
        method: 'GET',
        data: params,
        success: function(data) {
            var tbody = $('#orderTableBody');
            tbody.empty();
            if (data.length === 0) {
                tbody.append('<tr><td colspan="15" class="text-center text-muted">暂无匹配的订单</td></tr>');
                return;
            }

            var statusOptions = `
                <option value="0">待生产</option>
                <option value="1">生产中</option>
                <option value="2">待发货</option>
                <option value="3">已发货</option>
                <option value="4">已取消</option>
            `;


            var P = window.PERMS || {};
            var canEditAll = !!P['order:edit_all'];
            var canEditOwn = !!P['order:edit_own'];
            var isMine = function(order) {
                var cu = window.CURRENT_USER;
                if (!cu) return false;
                return (!!order.created_by_user_id && order.created_by_user_id === cu.id) || order.owner_user_id === cu.id;
            };
            data.forEach(function(order) {
                var items = order.items && order.items.length ? order.items : [];
                var itemCount = items.length;
                if (items.length === 0) {
                    items = [{product_name:'', spec:'', unit:'', quantity:0, price:0, shipped_quantity:0, remaining_quantity:0}];
                }

                var totalQuantity = 0;
                var shippedQuantity = 0;
                var totalAmount = 0;
                items.forEach(function(item) {
                    totalQuantity += Number(item.quantity || 0);
                    shippedQuantity += Number(item.shipped_quantity || 0);
                    totalAmount += Number(item.price || 0) * Number(item.quantity || 0);
                });
                var remainingQuantity = Math.max(0, totalQuantity - shippedQuantity);
                var progressClass = remainingQuantity <= 0 ? 'bg-success' : (shippedQuantity > 0 ? 'bg-info text-dark' : 'bg-secondary');
                var progressCell = `<span class="badge ${progressClass}">已发 ${shippedQuantity} / ${totalQuantity}</span><div class="small text-muted mt-1">剩余 ${remainingQuantity}</div>`;

                var payment = order.payment_status === 1
                    ? '<span class="badge bg-success">是</span>'
                    : '<span class="badge bg-secondary">否</span>';
                var canEditThis = canEditAll || (canEditOwn && isMine(order));
                var actions = '';
                actions += `<button class="btn btn-info btn-sm me-1" onclick="viewOrder(${order.id})">查看</button>`;
                if ((order.status === 1 || order.status === 2) && P['product:manage']) {
                    actions += `<button class="btn btn-success btn-sm me-1" onclick="openShipment(${order.id})"><i class="bi bi-truck"></i> 生成送货单</button>`;
                }
                if (canEditThis) {
                    actions += `<button class="btn btn-warning btn-sm me-1" onclick="editOrder(${order.id})">编辑</button>`;
                }
                if (canEditAll) {
                    actions += `<button class="btn btn-danger btn-sm" onclick="deleteOrder(${order.id})">删除</button>`;
                }

                var statusCell;
                if (canEditThis) {
                    statusCell = `<select class="form-select form-select-sm" onchange="updateStatus(${order.id}, this.value)">${statusOptions}</select>`;
                    statusCell = statusCell.replace(`value="${order.status}"`, `value="${order.status}" selected`);
                } else {
                    var st = {0:'待生产',1:'生产中',2:'待发货',3:'已发货',4:'已取消'}[order.status] || '未知';
                    statusCell = `<span class="badge ${statusBadge(order.status)}">${st}</span>`;
                }

                var detailHtml = items.map(function(item, index) {
                    var itemAmount = Number(item.price || 0) * Number(item.quantity || 0);
                    var itemShipped = Number(item.shipped_quantity || 0);
                    var itemRemaining = item.remaining_quantity === undefined
                        ? Math.max(0, Number(item.quantity || 0) - itemShipped)
                        : Number(item.remaining_quantity || 0);
                    return `<tr>
                        <td>${index + 1}</td>
                        <td class="text-start">${escapeOrderHtml(item.product_name || '-')}</td>
                        <td class="text-start">${escapeOrderHtml(item.spec || '-')}</td>
                        <td>${escapeOrderHtml(item.unit || '-')}</td>
                        <td>${item.quantity || 0}</td>
                        <td>${itemShipped}</td>
                        <td><strong>${itemRemaining}</strong></td>
                        <td>${orderMoney(order, item.price || 0)}</td>
                        <td>${orderMoney(order, itemAmount)}</td>
                    </tr>`;
                }).join('');

                var mainRow = `
                    <tr class="order-main-row" data-order-id="${order.id}">
                        <td class="text-nowrap">
                            <button type="button" class="btn btn-sm btn-outline-secondary me-1 order-detail-toggle" data-order-id="${order.id}" onclick="toggleOrderDetails(${order.id})" aria-expanded="false">
                                <i class="bi bi-chevron-right"></i>
                            </button>
                            <strong>${escapeOrderHtml(order.order_no)}</strong>
                        </td>
                        <td>${escapeOrderHtml(order.customer_name)}${order.owner_name ? ' <span class="small text-muted">负责：' + escapeOrderHtml(order.owner_name) + '</span>' : ''}</td>
                        <td>${escapeOrderHtml(order.region || '-')}</td>
                        <td>${itemCount} 项</td>
                        <td><strong>${totalQuantity}</strong></td>
                        <td>${orderMoney(order, order.total_amount || totalAmount)}</td>
                        <td>${formatDate(order.order_date)}</td>
                        <td>${formatDate(order.expected_shipping_date)}</td>
                        <td>${formatDate(order.customer_required_date)}</td>
                        <td>${warnHtml(order.warning_level, order.warning_label)}</td>
                        <td>${statusCell}</td>
                        <td>${progressCell}</td>
                        <td>${payment}</td>
                        <td>${escapeOrderHtml(order.remark || '-')}</td>
                        <td class="text-nowrap">${actions}</td>
                    </tr>`;

                var detailRow = `
                    <tr class="order-detail-row d-none" data-order-id="${order.id}">
                        <td colspan="15" class="bg-light">
                            <div class="small fw-bold mb-2">订单明细</div>
                            <div class="table-responsive">
                                <table class="table table-sm table-bordered bg-white mb-0">
                                    <thead>
                                        <tr>
                                            <th style="width:6%;">序号</th>
                                            <th style="width:23%;">产品名称</th>
                                            <th style="width:17%;">规格型号</th>
                                            <th style="width:8%;">单位</th>
                                            <th style="width:10%;">销售数量</th>
                                            <th style="width:9%;">已发</th>
                                            <th style="width:9%;">剩余</th>
                                            <th style="width:9%;">单价</th>
                                            <th style="width:9%;">金额</th>
                                        </tr>
                                    </thead>
                                    <tbody>${detailHtml}</tbody>
                                </table>
                            </div>
                        </td>
                    </tr>`;

                tbody.append(mainRow + detailRow);
            });        },
        error: function(xhr) {
            alert('加载订单失败: ' + xhr.responseText);
        }
    });
}

function applyFilter() {
    loadOrders($('#filterStatus').val(), $('#searchKeyword').val());
    loadOrderSummary();
}

function resetFilter() {
    $('#filterStatus').val('');
    $('#searchKeyword').val('');
    loadOrders();
    loadOrderSummary();
}

function openShipment(orderID) {
    window.location.href = '/products?ship_order_id=' + encodeURIComponent(orderID);
}

function statusBadge(s) {
    return {0:'bg-warning text-dark',1:'bg-info text-dark',2:'bg-primary',3:'bg-success',4:'bg-secondary'}[s] || 'bg-secondary';
}

function updateStatus(id, status) {
    var statusText = {0:'待生产',1:'生产中',2:'待发货',3:'已发货',4:'已取消'}[status];
    if (!confirm(`确定要将订单状态改为“${statusText}”吗？`)) {
        loadOrders($('#filterStatus').val(), $('#searchKeyword').val());
        return;
    }
    $.ajax({
        url: '/api/orders/status',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({id: id, status: parseInt(status)}),
        success: function() {
            alert('状态更新成功');
            applyFilter();
        },
        error: function(xhr) {
            alert('更新状态失败: ' + xhr.responseText);
        }
    });
}

function deleteOrder(id) {
    if (!confirm('确定要删除该订单吗？删除后成品库存与原材料库存将自动退回（明细一并删除）。')) return;
    $.ajax({
        url: `/api/orders/delete?id=${id}`,
        method: 'POST',
        success: function() {
            alert('删除成功');
            applyFilter();
        },
        error: function(xhr) {
            alert('删除失败: ' + xhr.responseText);
        }
    });
}

function createOrder() {
    var customerName = $('#customerName').val().trim();
    if (!customerName) {
        alert('请输入客户名称');
        return;
    }

    var items = [];
    var valid = true;
    var errors = [];
    $('.item-row').each(function(index) {
        var row = $(this);
        var productId = parseInt(row.find('.product-id-input').val());
        if (!productId) {
            orderProductAutocomplete.resolveRow(row);
            productId = parseInt(row.find('.product-id-input').val());
        }
        var quantity = parseInt(row.find('.quantity-input').val());
        var priceValue = String(row.find('.price-display').val() || '').trim();
        var price = parseFloat(priceValue);
        if (!productId) {
            errors.push(`第 ${index + 1} 行：请选择产品`);
            valid = false;
        } else if (!quantity || quantity <= 0) {
            errors.push(`第 ${index + 1} 行：销售数量必须大于0`);
            valid = false;
        } else if (priceValue === '' || isNaN(price) || price < 0) {
            errors.push(`第 ${index + 1} 行：请输入有效的产品单价`);
            valid = false;
        } else {
            items.push({product_id: productId, quantity: quantity, price: price});
        }
    });
    if (!valid) {
        alert(errors.join('\n'));
        return;
    }
    if (items.length === 0) {
        alert('请至少添加一个产品');
        return;
    }

    var data = {
        customer_name: customerName,
        customer_phone: $('#customerPhone').val().trim(),
        customer_address: $('#customerAddress').val().trim(),
        region: $('#region').val().trim(),
        order_date: $('#orderDate').val(),
        expected_shipping_date: $('#expectedShippingDate').val(),
        customer_required_date: $('#customerRequiredDate').val(),
        logistics_days: parseInt($('#logisticsDays').val()) || 0,
        payment_status: parseInt($('#paymentStatus').val()),
        prepared_by: $('#preparedBy').val().trim(),
        owner_user_id: parseInt($('#orderOwner').val()) || 0,
        payment_settlement: customFieldValue('paymentSettlement', 'paymentSettlementCustom'),
        freight_payment: customFieldValue('freightPayment', 'freightPaymentCustom'),
        freight_recovery: $('#freightRecovery').val(),
        transport_method: customFieldValue('transportMethod', 'transportMethodCustom'),
        remark: $('#createRemark').val().trim(),
        customer_id: parseInt($('#customerId').val()) || 0,
        currency: $('#currency').val() || 'CNY',
        trade_terms: $('#tradeTerms').val() || '',
        shipping_mark: $('#shippingMark').val().trim(),
        items: items
    };

    $.ajax({
        url: '/api/orders',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(data),
        success: function(response) {
            alert('订单创建成功，订单号：' + response.order_no);
            $('#createOrderModal').modal('hide');
            $('#createOrderForm')[0].reset();
            $('#orderItems .item-row:not(:first)').remove();
            $('#orderItems .item-row:first input').val('').removeClass('is-invalid');
            applyFilter();
        },
        error: function(xhr) {
            alert('创建订单失败: ' + xhr.responseText);
        }
    });
}

function editOrder(id) {
    $.ajax({
        url: `/api/orders/detail?id=${id}`,
        method: 'GET',
        success: function(data) {
            var order = data.order;
            $('#editOrderId').val(order.id);
            $('#editCustomerName').val(order.customer_name);
            $('#editRegion').val(order.region || '');
            $('#editOrderDate').val(formatDate(order.order_date) === '-' ? '' : formatDate(order.order_date));
            $('#editExpectedShippingDate').val(formatDate(order.expected_shipping_date) === '-' ? '' : formatDate(order.expected_shipping_date));
            $('#editCustomerRequiredDate').val(formatDate(order.customer_required_date) === '-' ? '' : formatDate(order.customer_required_date));
            $('#editLogisticsDays').val(order.logistics_days || 0);
            $('#editPaymentStatus').val(order.payment_status);
            $('#editPreparedBy').val(order.prepared_by || currentUserName());
            $('#editOrderOwner').val(order.owner_user_id || 0);
            setCustomField('editPaymentSettlement', 'editPaymentSettlementCustom', order.payment_settlement || '现付', ['现付']);
            setCustomField('editFreightPayment', 'editFreightPaymentCustom', order.freight_payment || '现付', ['现付']);
            $('#editFreightRecovery').val(order.freight_recovery === '不可回收' ? '不可回收' : '可回收');
            setCustomField('editTransportMethod', 'editTransportMethodCustom', order.transport_method || '物流', ['物流', '快递']);
            $('#editCustomerId').val(order.customer_id || 0);
            $('#editCurrency').val(order.currency || 'CNY');
            $('#editTradeTerms').val(order.trade_terms || '');
            $('#editShippingMark').val(order.shipping_mark || '');
            $('#editRemark').val(order.remark || '');
            $('#editOrderModal').modal('show');
        },
        error: function() {
            alert('加载订单数据失败');
        }
    });
}

}

    var y = today.getFullYear();

function currentMonthStr() {
    var now = new Date();
    var m = ('0' + (now.getMonth() + 1)).slice(-2);
    return now.getFullYear() + '-' + m;
}

function loadOrderSummary() {
    var month = $('#summaryMonth').val() || currentMonthStr();
    $.ajax({
        url: '/api/orders/summary?month=' + encodeURIComponent(month),
        method: 'GET',
        success: function (res) {
            $('#monthlyTotal').text('¥' + parseFloat(res.monthly_total || 0).toFixed(2));
            $('#monthlyCount').text(res.monthly_count || 0);
            $('#yearlyTotal').text('¥' + parseFloat(res.yearly_total || 0).toFixed(2));
            $('#yearlyCount').text(res.yearly_count || 0);
        }
    });
}

$(document).ready(function() {
    if (!$('#summaryMonth').val()) $('#summaryMonth').val(currentMonthStr());
    loadOrderSummary();
    $('#summaryMonth').on('change', loadOrderSummary);

    bindCustomField('paymentSettlement', 'paymentSettlementCustom');
    bindCustomField('freightPayment', 'freightPaymentCustom');
    bindCustomField('transportMethod', 'transportMethodCustom');
    bindCustomField('editPaymentSettlement', 'editPaymentSettlementCustom');
    bindCustomField('editFreightPayment', 'editFreightPaymentCustom');
    bindCustomField('editTransportMethod', 'editTransportMethodCustom');
    fillOrderOptionSelects();
    fillOwnerOptions();
    $('#searchKeyword').on('keypress', function(e) {
        if (e.which === 13) applyFilter();
    });
});
